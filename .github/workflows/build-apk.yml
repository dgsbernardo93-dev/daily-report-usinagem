name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova@12

    - name: Create Cordova Project
      run: |
        cordova create app com.usinagem.dailyreport "Daily Report"
        cd app
        cordova platform add android@12

    - name: Install Plugins
      run: |
        cd app
        cordova plugin add cordova-plugin-camera
        cordova plugin add cordova-plugin-x-socialsharing@5.4.0
        cordova plugin add cordova-plugin-android-permissions

    - name: Copy Files
      run: |
        cp index.html app/www/index.html
        cp config.xml app/config.xml

    - name: Build APK
      run: |
        cd app
        cordova build android --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DailyReport-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
