<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daily Report - Usinagem</title>
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f7; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); margin: auto; overflow: hidden; }
        .header { background: linear-gradient(135deg, #075e54, #128c7e); color: white; padding: 25px 20px; text-align: center; }
        .header h2 { margin: 0; font-size: 24px; letter-spacing: 0.5px; text-transform: uppercase; }
        .header p { margin: 5px 0 0; font-size: 14px; opacity: 0.95; font-weight: 500; }
        .form-body { padding: 20px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 13px; color: #444; text-transform: uppercase; }
        input[type="date"], input[type="text"], input[type="number"], textarea { width: 100%; padding: 12px; border: 1.5px solid #ccd0d5; border-radius: 8px; font-size: 16px; background: #fafbfc; }
        input:focus, textarea:focus { border-color: #128c7e; outline: none; background: #fff; }
        textarea { resize: vertical; height: 75px; }
        .badge-sector { display: inline-block; background: #e1f5fe; color: #0288d1; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .radio-group { background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1.5px solid #e1e4e8; }
        .radio-option { display: flex; align-items: center; margin-bottom: 10px; font-size: 15px; font-weight: 500; cursor: pointer; }
        .radio-option:last-child { margin-bottom: 0; }
        .radio-option input { margin-right: 12px; width: 20px; height: 20px; accent-color: #128c7e; }
        .desvio-box { background: #fff5f5; padding: 14px; border-radius: 8px; border: 1.5px solid #feb2b2; margin-bottom: 18px; display: none; }
        .desvio-box label { color: #c53030; }
        .desvio-box input, .desvio-box textarea { background: #fff; border-color: #fc8181; }
        .file-section { background: #f8f9fa; padding: 14px; border: 1.5px dashed #128c7e; border-radius: 8px; margin-bottom: 10px; text-align: center; cursor: pointer; }
        .file-section span { color: #075e54; font-weight: bold; font-size: 14px; display: block; }
        .file-count { font-size: 13px; margin-top: 8px; font-weight: bold; text-align: center; padding: 6px; border-radius: 6px; background: #f1f3f5; color: #555; }
        button.whatsapp-btn { width: 100%; background: linear-gradient(135deg, #25d366, #128c7e); color: white; border: none; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>⚙️ Daily Report</h2>
        <p>Usinagem</p>
    </div>
    
    <div class="form-body">
        <div class="form-group">
            <label for="termino">📅 Data de Término:</label>
            <input type="date" id="termino">
        </div>
        <div class="form-group">
            <label>📌 Setor:</label>
            <div class="badge-sector">Usinagem</div>
        </div>
        <div class="form-group">
            <label>🔧 Equipamento:</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="equipamento" value="Centro de Usinagem" onchange="toggleTratamento()" checked> Centro de Usinagem</label>
                <label class="radio-option"><input type="radio" name="equipamento" value="Embalagem/Prateleira" onchange="toggleTratamento()"> Embalagem/Prateleira</label>
                <label class="radio-option"><input type="radio" name="equipamento" value="Fresadora convencional" onchange="toggleTratamento()"> Fresadora convencional</label>
                <label class="radio-option"><input type="radio" name="equipamento" value="Furadeira Radial" onchange="toggleTratamento()"> Furadeira Radial</label>
                <label class="radio-option"><input type="radio" name="equipamento" value="Torno CNC" onchange="toggleTratamento()"> Torno CNC</label>
                <label class="radio-option"><input type="radio" name="equipamento" value="Torno convencional" onchange="toggleTratamento()"> Torno convencional</label>
                <label class="radio-option"><input type="radio" name="equipamento" value="Tratamento térmico" onchange="toggleTratamento()"> Tratamento térmico</label>
            </div>
        </div>
        <div class="form-group" id="movimentacaoTratamento" style="display: none;">
            <label>🔄 Movimentação do material:</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="movimentacao" value="🔥 Enviando (Saída para Têmpera)"> 🔥 Enviando (Saída para Têmpera)</label>
                <label class="radio-option"><input type="radio" name="movimentacao" value="🔥 Retornando (Chegada da Têmpera)"> 🔥 Retornando (Chegada da Têmpera)</label>
            </div>
        </div>
        <div class="form-group">
            <label for="os">🔢 Número da O.S.:</label>
            <input type="text" id="os" placeholder="Ex: OP0112">
        </div>
        <div class="form-group">
            <label for="qtd">📦 Quantidade (pçs):</label>
            <input type="number" id="qtd" placeholder="Ex: 02">
        </div>
        <div class="form-group">
            <label>⚙️ Status / Etapa:</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="etapa" value="Usinagem Lado 1" checked> Usinagem Lado 1</label>
                <label class="radio-option"><input type="radio" name="etapa" value="Usinagem Lado 2"> Usinagem Lado 2</label>
                <label class="radio-option"><input type="radio" name="etapa" value="Peça finalizada"> Peça finalizada</label>
            </div>
        </div>
        <div class="form-group">
            <label>⚠️ Houve peças com desvio?</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="houveDesvio" id="desvioNao" value="Não" checked onclick="toggleDesvio(false)"> Não</label>
                <label class="radio-option"><input type="radio" name="houveDesvio" id="desvioSim" value="Sim" onclick="toggleDesvio(true)"> Sim</label>
            </div>
        </div>
        <div class="desvio-box" id="camposDesvio">
            <div class="form-group" style="margin-bottom: 12px;">
                <label for="qtdDesvio">🔢 Qtd de Peças com Desvio:</label>
                <input type="number" id="qtdDesvio" placeholder="Ex: 01">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="obsDesvio">📝 Observação do Desvio:</label>
                <textarea id="obsDesvio" placeholder="Descreva o motivo..."></textarea>
            </div>
        </div>
        <div class="form-group">
            <label for="obs">📝 Observações Gerais (Opcional):</label>
            <textarea id="obs" placeholder="Detalhes..."></textarea>
        </div>
        <div class="form-group">
            <label>📸 Registo Fotográfico:</label>
            <div class="file-section" onclick="tirarFotoCamera()">
                <span>📷 Tirar Foto com a Câmara</span>
            </div>
            <div class="file-section" onclick="tirarFotoGaleria()">
                <span>📁 Escolher da Galeria</span>
            </div>
            <div class="file-count" id="contadorFotos">Nenhuma foto selecionada.</div>
        </div>
        <button class="whatsapp-btn" onclick="enviarWhatsApp()">Enviar Daily Report 🚀</button>
    </div>
</div>

<script>
    document.addEventListener("deviceready", onDeviceReady, false);
    document.getElementById('termino').valueAsDate = new Date();
    let listaFotos = []; 

    function onDeviceReady() { console.log("Cordova pronto."); }

    function toggleTratamento() {
        const selecionado = document.querySelector('input[name="equipamento"]:checked');
        document.getElementById('movimentacaoTratamento').style.display = (selecionado && selecionado.value === "Tratamento térmico") ? 'block' : 'none';
    }

    function toggleDesvio(mostrar) {
        document.getElementById('camposDesvio').style.display = mostrar ? 'block' : 'none';
        if (!mostrar) { document.getElementById('qtdDesvio').value = ''; document.getElementById('obsDesvio').value = ''; }
    }

    function atualizarContador() {
        document.getElementById('contadorFotos').textContent = listaFotos.length === 0 ? "Nenhuma foto selecionada." : `✅ ${listaFotos.length} foto(s) pronta(s).`;
    }

    function tirarFotoCamera() {
        if (navigator.camera) {
            navigator.camera.getPicture(onSuccess, onFail, { 
                quality: 60, destinationType: Camera.DestinationType.FILE_URI, sourceType: Camera.PictureSourceType.CAMERA, correctOrientation: true
            });
        }
    }

    function tirarFotoGaleria() {
        if (navigator.camera) {
            navigator.camera.getPicture(onSuccess, onFail, { 
                quality: 60, destinationType: Camera.DestinationType.FILE_URI, sourceType: Camera.PictureSourceType.PHOTOLIBRARY, correctOrientation: true
            });
        }
    }

    function onSuccess(imageURI) {
        if (imageURI && !imageURI.startsWith('file://') && !imageURI.startsWith('content://')) {
            imageURI = 'file://' + imageURI;
        }
        listaFotos.push(imageURI);
        atualizarContador();
    }

    function onFail(message) {
        if (message !== "No Image Selected" && message !== "User cancelled dialog") alert('Falha: ' + message);
    }

    function enviarWhatsApp() {
        const os = document.getElementById('os').value;
        if (!os) { alert('Preencha a O.S.'); return; }
        if (listaFotos.length === 0) { alert('Adicione pelo menos uma foto.'); return; }

        const termino = document.getElementById('termino').value;
        const dataFormatada = termino ? termino.split('-').reverse().join('/') : '';
        const equipamento = document.querySelector('input[name="equipamento"]:checked').value;

        let textoMensagem = `📊 *DAILY REPORT - USINAGEM*\n\n📅 *Término:* ${dataFormatada}\n🔧 *Equipamento:* ${equipamento}\n🔢 *O.S.:* ${os}`;

        // APK: O segredo é usar share() e passar o array de fotos no terceiro parâmetro.
        if (window.plugins && window.plugins.socialsharing) {
            window.plugins.socialsharing.share(
                textoMensagem,      // Texto
                'Daily Report',     // Assunto
                listaFotos,         // Array de caminhos (fotos)
                null,               // URL
                function() { limparFormulario(); }, // Sucesso
                function(err) {     // Erro
                    console.error('Erro no share:', err);
                    alert("Erro ao enviar fotos. Vamos enviar só o texto.");
                    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoMensagem)}`, '_blank');
                    limparFormulario();
                }
            );
            return;
        }

        // Fallback para o link da Netlify
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoMensagem)}`, '_blank');
        limparFormulario();
    }

    function limparFormulario() {
        document.getElementById('os').value = '';
        document.getElementById('qtd').value = '';
        document.getElementById('obs').value = '';
        document.getElementById('desvioNao').checked = true;
        toggleDesvio(false);
        listaFotos = [];
        atualizarContador();
        document.getElementById('termino').valueAsDate = new Date();
    }
</script>
</body>
</html>
